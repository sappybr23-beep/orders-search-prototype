:root {

* { box-sizing: border-box; }

.ico { width: 24px; height: 24px; display: block; flex: none; }
.ico16 { width: 16px; height: 16px; display: block; flex: none; }
.mask { display: block; flex: none; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }

/* ---------- shell ---------- */
.app { display: flex; height: 100%; }
.sidebar { width: 80px; flex: none; background: var(--bg-container); display: flex; flex-direction: column; justify-content: space-between; height: 100%; position: relative; z-index: 2; }
.sidebar .logo { height: 74px; padding: 32px 24px 0 28px; }

.side-item img { position: relative; }
.side-item:hover::before { content: ""; position: absolute; inset: 8px 16px; background: var(--bg-hover); border-radius: 8px; }
.main { flex: 1; min-width: 0; background: var(--bg-main); border-radius: 24px 0 0 24px; height: 100%; overflow: hidden; display: flex; flex-direction: column; padding: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); gap: 24px; position: relative; }
.mob-header { display: none; }
.tabbar { display: none; }

/* ---------- toolbar (closed) ---------- */

.filters { display: flex; gap: 8px; align-items: center; min-width: 0; }

.icon-btn:hover { background: rgba(255,255,255,.6); }
.actions { display: flex; gap: 16px; align-items: center; flex: none; }
.txt-btn { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border-radius: 16px; font: 600 17px/28px var(--font); color: var(--accent); transition: background .15s, box-shadow .15s; }

/* ---------- search component ---------- */

.field input { flex: 1 1 120px; min-width: 120px; border: 0; background: transparent; outline: none; height: 40px; font-size: 15px; line-height: 20px; color: var(--primary); padding: 0; }
.field input::placeholder { color: var(--secondary); }
.clear-btn { width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; align-self: flex-start; margin-top: 4px; color: var(--hint); transition: background .15s, color .15s; }
.clear-btn .mask { width: 24px; height: 24px; --m: url(data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJJY29uL00vQ2xvc2UiPgo8cGF0aCBpZD0iVW5pb24iIGQ9Ik0xNi4yOTMgNi4yOTMwNEMxNi42ODM2IDUuOTAyNTIgMTcuMzE2NiA1LjkwMjUyIDE3LjcwNzEgNi4yOTMwNEMxOC4wOTc2IDYuNjgzNTggMTguMDk3NiA3LjMxNjYxIDE3LjcwNzEgNy43MDcxMUwxMy40MTQxIDEyLjAwMDFMMTcuNzA3MSAxNi4yOTNDMTguMDk3NiAxNi42ODM2IDE4LjA5NzYgMTcuMzE2NiAxNy43MDcxIDE3LjcwNzFDMTcuMzE2NiAxOC4wOTc2IDE2LjY4MzYgMTguMDk3NSAxNi4yOTMgMTcuNzA3MUwxMi4wMDAxIDEzLjQxNDFMNy43MDcxMSAxNy43MDcxQzcuMzE2NjEgMTguMDk3NiA2LjY4MzU4IDE4LjA5NzUgNi4yOTMwNSAxNy43MDcxQzUuOTAyNTMgMTcuMzE2NiA1LjkwMjUzIDE2LjY4MzYgNi4yOTMwNSAxNi4yOTNMMTAuNTg2IDEyLjAwMDFMNi4yOTMwNSA3LjcwNzExQzUuOTAyNTMgNy4zMTY1OCA1LjkwMjUzIDYuNjgzNTcgNi4yOTMwNSA2LjI5MzA0QzYuNjgzNTcgNS45MDI1MiA3LjMxNjU5IDUuOTAyNTIgNy43MDcxMSA2LjI5MzA0TDEyLjAwMDEgMTAuNTg2TDE2LjI5MyA2LjI5MzA0WiIgZmlsbD0iI0I0QjhDQiIvPgo8L2c+Cjwvc3ZnPgo=); }
.clear-btn:hover { color: var(--secondary); background: rgba(53,62,108,.06); }
.clear-btn:active { background: var(--secondary); color: #fff; }
.hint { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--secondary); padding: 0 16px; margin-top: -8px; }
.hint.err { color: var(--error); }
.hint .count { margin-left: auto; color: var(--secondary); white-space: nowrap; }

/* ---------- dropdowns ---------- */
.pop { position: absolute; z-index: 30; background: var(--bg-container); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 8px 0; min-width: 300px; }
.pop[hidden] { display: none; }
.opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; font-size: 15px; line-height: 21px; color: var(--primary); text-align: left; }
.opt:hover, .opt.kbd { background: var(--bg-hover); }
.opt .check { width: 18px; height: 18px; color: var(--accent); visibility: hidden; flex: none; }
.opt[aria-selected="true"] .check { visibility: visible; }
.opt .box { width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px var(--hint); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.opt[aria-selected="true"] .box { background: var(--accent); box-shadow: none; }
.opt[aria-selected="true"] .box::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.pop-foot { display: flex; justify-content: space-between; padding: 8px 20px 4px; border-top: 1px solid var(--divider); margin-top: 4px; }
.link { color: var(--accent); font-weight: 500; }
.link:hover { text-decoration: underline; }

/* ---------- table ---------- */
.table-card { flex: 1; min-height: 0; background: var(--bg-container); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.table-scroll { flex: 1; min-height: 0; overflow: auto; }
.grid { display: grid; grid-template-columns: minmax(180px,1fr) minmax(140px,.8fr) minmax(120px,.8fr) minmax(140px,.9fr) minmax(220px,1.2fr) minmax(160px,1fr) minmax(200px,1.3fr) minmax(180px,1fr) minmax(220px,1.5fr) minmax(170px,1.2fr); min-width: 1730px; }
.grid > :first-child { position: sticky; left: 0; z-index: 1; background: var(--bg-container); }
.thead > :first-child { z-index: 3; }
.row:hover > :first-child { background: var(--bg-hover); }
.table-scroll.scrolled-x .grid > :first-child { box-shadow: 6px 0 10px -6px rgba(53,62,108,.18); }
kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-container); box-shadow: inset 0 0 0 1px var(--divider), 0 1px 0 var(--divider); font: 500 11px/1 var(--font); color: var(--primary); }
.enter-hint { display: none; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 10px; color: var(--secondary); font-size: 12px; white-space: nowrap; flex: none; align-self: flex-start; margin-top: 4px; }
.enter-hint:hover { background: rgba(53,62,108,.06); color: var(--primary); }
.enter-hint .mob { display: none; }
.field.typing .enter-hint { display: inline-flex; }
.thead { position: sticky; top: 0; z-index: 2; background: var(--bg-container); box-shadow: 0 4px 10px rgba(53,62,108,.04); }
.th { min-height: 56px; display: flex; align-items: center; gap: 2px; padding: 0 8px; color: var(--secondary); white-space: nowrap; }
.th .lbl-t { overflow: hidden; text-overflow: ellipsis; }
.th.col-search { cursor: text; transition: background .15s, color .15s; }
.th.col-search:hover { background: var(--bg-hover); color: var(--primary); }
.th .cnt { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font: 500 11px/18px var(--font); text-align: center; margin-left: 4px; flex: none; }
.sort-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; flex: none; cursor: pointer; }
.sort-btn:hover { background: rgba(53,62,108,.06); }
.th.editing { position: relative; flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; padding-top: 12px; padding-bottom: 12px; padding-right: 36px; min-height: 84px; background: var(--bg-container); color: var(--secondary); cursor: text; }
.th.editing:hover { background: var(--bg-container); }
.th.editing .cap { font-size: 13px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; }
.th.editing .colin { display: flex; align-items: center; gap: 6px; min-width: 0; }
.th.editing input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 0; font: 400 15px/24px var(--font); color: var(--primary); caret-color: var(--primary); }
.th.editing .cerr { font-size: 11px; line-height: 14px; color: var(--error); white-space: normal; }
.th.editing.err input { color: var(--error); }
.th.editing .sort-btn, .th.editing .sort-ico { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.th:first-child, .td:first-child { padding-left: 16px; }
.th.r { justify-content: flex-end; }
.th.sortable { cursor: pointer; }
.th.sortable:hover { color: var(--primary); }
.th .sort { opacity: .8; }
.th.sorted { color: var(--primary); }
.th.sorted .sort { filter: invert(43%) sepia(73%) saturate(2400%) hue-rotate(216deg) brightness(95%); }
.row { border-top: 1px solid var(--divider); padding: 2px 0; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg-hover); }
.td { min-height: 56px; padding: 6px 8px; min-width: 0; display: flex; flex-direction: column; }
.td.r { align-items: flex-end; }
.td .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.td .t2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.td .t2w { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.td .s { font-size: 11px; line-height: 16px; color: var(--secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.td .m { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.idlink { color: var(--accent); }
.idlink:hover { text-decoration: underline; }
mark { background: rgba(84,115,232,.16); color: inherit; border-radius: 3px; padding: 0 1px; }
.status { display: inline-flex; align-items: center; padding: 2px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; align-self: flex-start; }
.st-yellow { background: var(--st-yellow-bg); color: var(--st-yellow); }
.st-green { background: var(--st-green-bg); color: var(--st-green); }
.st-blue { background: var(--accent-soft); color: var(--accent); }
.st-grey { background: var(--st-grey-bg); color: var(--st-grey); }
.tfoot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--divider); color: var(--secondary); flex: none; }
.tfoot .l { display: flex; gap: 16px; align-items: center; }
.size-btn { color: var(--secondary); display: inline-flex; align-items: center; gap: 2px; position: relative; }
.size-btn b { color: var(--accent); font-weight: 500; }
.pager { display: flex; gap: 4px; align-items: center; }
.pager button { min-width: 28px; height: 28px; border-radius: 8px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.pager button:hover:not(:disabled) { background: var(--bg-hover); }
.pager button[aria-current="true"] { color: var(--primary); font-weight: 500; background: var(--bg-hover); }
.pager button:disabled { opacity: .35; cursor: default; }

/* ---------- empty / skeleton ---------- */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 24px; gap: 0; min-height: 320px; }
.empty img { width: 89px; height: 80px; margin-bottom: 24px; }
.empty h3 { margin: 0; font: 600 20px/28px var(--font); }
.empty p { margin: 16px 0 0; font-size: 15px; line-height: 24px; color: var(--secondary); max-width: 360px; }
.empty .acts { margin-top: 20px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.sk { background: linear-gradient(90deg, #EEF0F6 25%, #F6F7FB 50%, #EEF0F6 75%); background-size: 200% 100%; animation: sh 1.1s linear infinite; border-radius: 6px; height: 12px; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk, .chip.flash { animation: none; } }

/* ---------- cards (mobile) ---------- */
.cards { display: none; }
.card { background: var(--bg-container); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.card-h { display: flex; align-items: center; gap: 8px; }
.card-h .idlink { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: flex; gap: 16px; min-height: 28px; align-items: center; }
.kv .k { color: var(--secondary); flex: none; }
.kv .v { flex: 1; min-width: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .v.m { font-weight: 500; font-variant-numeric: tabular-nums; }
.more-btn { height: 44px; border-radius: 16px; background: var(--bg-container); color: var(--accent); font-weight: 600; font-size: 15px; }

/* ---------- onboarding ---------- */
.scrim { position: fixed; inset: 0; background: rgba(39,44,62,.45); z-index: 40; }
.coach { position: fixed; z-index: 42; width: 252px; background: var(--bg-container); border-radius: 24px; padding: 24px; box-shadow: var(--shadow-pop); }
.coach h4 { margin: 0; font: 600 17px/28px var(--font); }
.coach p { margin: 4px 0 16px; font-size: 13px; line-height: 20px; color: var(--primary); }
.coach .btn { width: 100%; height: 32px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 600; }
.coach .btn:hover { filter: brightness(1.06); }
.lifted { position: relative; z-index: 41; background: var(--bg-container) !important; box-shadow: var(--shadow-btn); }

/* ---------- prototype panel ---------- */
.proto { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.proto-toggle { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--primary); color: #fff; font-weight: 500; box-shadow: var(--shadow-pop); display: inline-flex; align-items: center; gap: 6px; }
.proto-toggle::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #00CCD7; }
.proto-menu { background: var(--bg-container); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 8px; width: 280px; display: flex; flex-direction: column; }
.proto-menu .cap { font-size: 11px; line-height: 16px; color: var(--secondary); padding: 8px 12px 4px; text-transform: uppercase; letter-spacing: .06em; }
.proto-menu button { text-align: left; padding: 8px 12px; border-radius: 10px; }
.proto-menu button:hover { background: var(--bg-hover); }
.proto-menu .bp { padding: 4px 12px 8px; color: var(--secondary); font-size: 12px; }

const money = n => n.toLocaleString("ru-RU",{ minimumFractionDigits:2, maximumFractionDigits:2 }).replace(/ /g," ") + " ₽";
const moneyShort = n => (Number.isInteger(n) ? n.toLocaleString("ru-RU") : n.toLocaleString("ru-RU",{minimumFractionDigits:2})).replace(/ /g," ") + " ₽";
const isMobile = () => matchMedia("(max-width: 1023px)").matches;
const stClass = s => ({ Expired:"st-yellow", Completed:"st-green", Blocked:"st-grey" }[s] || "st-blue");

/* ================= logic ================= */
function passFilters(o, f = S.f){
  const day = Math.round((TODAY - new Date(...o.date.split(".").reverse().map((x,i)=>i===1?x-1:+x)).getTime()) / DAY);
  if (f.period === "today" && day !== 0) return false;
  if (f.period === "yesterday" && day !== 1) return false;
  if (f.period === "week" && day > 6) return false;
  if (f.period === "month" && day > 29) return false;
  if (f.status.size && !f.status.has(o.status)) return false;
  if (f.sector.size && !f.sector.has(o.sector)) return false;
  if (f.pay.size) { const sbp = o.merchant.includes("СБП"); if (!(f.pay.has("sbp") && sbp) && !(f.pay.has("card") && !sbp)) return false; }
  return true;
}
const validChips = () => S.chips.filter(c => c.valid);
function passSearch(o){
  const vc = validChips();
  if (!vc.length) return true;
  return vc.some(c => CRIT[c.field].match(o, c.value));
}
function results(){
  const k = S.sort.key, d = S.sort.dir;
  const list = ORDERS.filter(o => passFilters(o) && passSearch(o));
  if (!k) return list;
  return list.sort((a,b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * d);
}
function hiddenByFilters(){
  if (!validChips().length) return 0;
  return ORDERS.filter(o => passSearch(o) && !passFilters(o)).length;
}
function filtersActive(){ return S.f.period !== "today" || S.f.status.size || S.f.sector.size || S.f.pay.size || S.f.regular !== "all"; }

function addValues(raws, field = S.crit){
  const c = CRIT[field];
  let added = 0, dups = 0, over = 0, firstDup = null;
  for (let raw of raws) {
    raw = raw.trim(); if (!raw) continue;
    const value = c.norm(raw);
    const exist = S.chips.find(x => x.field === field && x.value === value);
    if (exist) { dups++; firstDup = firstDup || exist; continue; }
    if (S.chips.length >= LIMIT) { over++; continue; }
    const v = c.valid(value);
    S.chips.push({ id:++uid, field, value, valid:v === true, error:v === true ? "" : v });
    added++;
  }
  S.selectedChip = -1;
  const parts = [];
  if (over) parts.push(`Можно добавить не больше ${LIMIT} значений — ${over} не добавлено`);
  if (dups) parts.push(dups === 1 ? "Это значение уже добавлено" : `${dups} значения уже были добавлены`);
  S.hint = parts.length ? { err:!!over, text:parts.join(". ") } : null;
  render();
  if (firstDup) requestAnimationFrame(() => { const el = document.querySelector(`.chip[data-id="${firstDup.id}"]`); if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } });
  if (added) runSearch();
  return { added, dups, over };
}
function removeChip(id){ S.chips = S.chips.filter(c => c.id !== id); S.selectedChip = -1; S.hint = null; render(); runSearch(); focusInput(); }
function editChip(id){
  const ch = S.chips.find(c => c.id === id); if (!ch) return;
  S.chips = S.chips.filter(c => c.id !== id); S.crit = ch.field;
  S.text = ch.field === "phone" && ch.valid ? fmtPhoneTyping(ch.value) : ch.value; S.hint = null;
  render(); runSearch(); focusInput(true);
}
function splitRaw(text, field = S.crit){
  const re = CRIT[field].spaceSplit ? /[,;\n\r\t ]+/ : /[,;\n\r\t]+/;
  return text.split(re);
}
function runSearch(){
  S.page = 1; S.mobShown = 20;
  const t = ++searchToken;
  if (S.delay) { S.loading = true; renderResults(); setTimeout(() => { if (t !== searchToken) return; S.loading = false; renderResults(); }, 650); }
  else renderResults();
}
function openSearch(){ S.open = true; dismissCoach(true); render(); focusInput(); }
function closeSearch(){
  const had = validChips().length;
  S.open = false; S.chips = []; S.text = ""; S.hint = null; S.selectedChip = -1; closePop(); render();
  if (had) runSearch();
  requestAnimationFrame(() => { const b = document.querySelector("[data-act=open]:not([hidden])"); if (b && !isMobile()) b.focus(); });
}
function clearOrClose(){
  if (S.chips.length || S.text) { const had = validChips().length; S.chips = []; S.text = ""; S.hint = null; render(); if (had) runSearch(); focusInput(); }
  else closeSearch();
}

function filterLabel(key){
  const f = FILTERS[key], v = S.f[key];
  if (f.single) {
    const lbl = f.opts.find(o => o[0] === v)[1];
    if (key === "period") return `Период: <b>${lbl}</b>`;
    return v === f.def ? f.title : `${f.title}: <b>${lbl}</b>`;
  }
  if (!v.size) return f.title;
  const first = f.opts.find(o => v.has(o[0]))[1];
  return `${f.title}: <b>${esc(first)}${v.size > 1 ? " +" + (v.size - 1) : ""}</b>`;
}

/* ================= render: results ================= */
function hl(text, key){
  const vc = validChips().filter(c => CRIT[c.field].hl === key);
  if (!vc.length || !text) return esc(text);
  let html = esc(text);
  for (const c of vc) {
    const i = text.toLowerCase().indexOf(c.value.toLowerCase());
    if (i >= 0) { return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i + c.value.length)) + "</mark>" + esc(text.slice(i + c.value.length)); }
  }
  return html;
}
function extraMatch(o){
  for (const c of validChips()) { const cr = CRIT[c.field]; if (cr.extra && cr.match(o, c.value)) return { label: cr.extraLabel, value: o[cr.extra] }; }
  return null;
}

  if (!raws.length) return;

    return;
  }
  if (e.target.id !== "q") return;
  const q = e.target; let v = q.value;
  const re = CRIT[S.crit].spaceSplit ? /[,;\n\t ]/ : /[,;\n\t]/;
  if (re.test(v)) {
    const parts = splitRaw(v); const last = parts.pop();
    S.text = S.crit === "phone" ? fmtPhoneTyping(last) : last;
    addValues(parts); focusInput(); return;
  }
  if (S.crit === "phone" && /^[\d\s()+\-]*$/.test(v)) {
    const atEnd = q.selectionStart === v.length;
    const f = fmtPhoneTyping(v);
    if (f !== v && atEnd && !(e.inputType || "").startsWith("delete")) { q.value = f; v = f; }
  }
  S.text = v;
  const fld = $("#field"); if (fld) fld.classList.toggle("typing", !!v.trim());
  if (S.hint && !S.hint.err) { S.hint = null; renderTop(); focusInput(); }
});
document.addEventListener("paste", e => {
  if (e.target.id !== "q") return;
  const txt = (e.clipboardData || window.clipboardData).getData("text");
  const re = CRIT[S.crit].spaceSplit ? /[,;\n\r\t ]/ : /[,;\n\r\t]/;
  if (!re.test(txt.trim())) return;
  e.preventDefault();
  const q = e.target; const before = q.value.slice(0, q.selectionStart), after = q.value.slice(q.selectionEnd);
  S.text = "";
  addValues(splitRaw(before + txt + after));
  focusInput();
});
document.addEventListener("focusin", e => { if (e.target.id === "q" && !S.focus) { S.focus = true; $("#field").classList.add("focus"); } });
document.addEventListener("focusout", e => { if (e.target.id === "q") { S.focus = false; const f = $("#field"); if (f) f.classList.remove("focus"); } });
addEventListener("resize", () => {
  if (popFor && popAnchor) {
    const [a, cls] = popAnchor;
    const sel = a.id ? "#" + a.id : a.dataset.filter ? `[data-filter="${a.dataset.filter}"]` : null;
    const fresh = sel && document.querySelector(sel);
    if (fresh && fresh.getClientRects().length) { fresh.setAttribute("aria-expanded","true"); placePop(fresh, cls); } else closePop();
  }
  positionCoach(); updateBp();
});
addEventListener("scroll", () => { positionCoach(); }, { passive: true });
document.addEventListener("scroll", e => {
  if (!e.target.classList || !e.target.classList.contains("table-scroll")) return;
  e.target.classList.toggle("scrolled-x", e.target.scrollLeft > 0);
}, { capture: true, passive: true });

function toggleSort(key){ S.sort = S.sort.key === key ? { key, dir: -S.sort.dir } : { key, dir: key === "ts" ? -1 : 1 }; renderResults(); }

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* ================= scenarios ================= */
function resetAll(){
  closePop(); S.col = { crit:null, text:"", err:"" };
  Object.assign(S, { open:false, crit:"order", chips:[], text:"", hint:null, selectedChip:-1, page:1, mobShown:20, sort:{ key:null, dir:1 },
    f:{ period:"today", status:new Set(), sector:new Set(), regular:"all", pay:new Set() } });
}
function chip(field, value){ const c = CRIT[field]; const v = c.norm(value); const ok = c.valid(v); return { id:++uid, field, value:v, valid:ok === true, error:ok === true ? "" : ok }; }
function scenario(k){
  $("#protoMenu").hidden = true; $("#protoToggle").setAttribute("aria-expanded","false");
  if (k === "delay") { S.delay = !S.delay; $("#delayBtn").textContent = "Скелетон при поиске: " + (S.delay ? "вкл" : "выкл"); toast(S.delay ? "Скелетон включён" : "Скелетон выключен"); return; }
  resetAll();
  if (k === "onboarding") { S.onboarded = false; store.set("orders-search-onboarded","0"); }
  else S.onboarded = true, store.set("orders-search-onboarded","1");
  if (k === "multi") { S.open = true; S.crit = "phone"; S.chips = [chip("phone","+79992482323"), chip("order","10196074")]; }
  if (k === "empty") { S.open = true; S.chips = [chip("order","10196099")]; }
  if (k === "period") { S.open = true; S.crit = "email"; const o = ORDERS.find(x => x.date !== "20.12.2023"); S.chips = [chip("email", o.email)]; }
  if (k === "invalid") { S.open = true; S.crit = "email"; S.chips = [chip("email","a.lukonina@mail.ru"), chip("email","petrov.ivan@yandex"), chip("phone","8 999 248")]; S.hint = null; }
  if (k === "limit") { S.open = true; S.chips = ORDERS.slice(0, 20).map(o => chip("order", o.id.slice(0, 18))); }
  render(); runSearch();
  if (k === "invalid") setTimeout(() => { S.text = ""; addValues(["a.lukonina@mail.ru"]); }, 50);
  if (S.open) focusInput();
}
function updateBp(){
  const w = innerWidth;
  const bp = w < 576 ? "375 (мобильный)" : w < 1024 ? "576 (мобильный, широкий)" : w < 1280 ? "1024 (компактный десктоп)" : w < 1920 ? "1440 (десктоп)" : "1920 (широкий десктоп)";
  const el = $("#bpInfo"); if (el) el.textContent = `Ширина окна ${w}px → макет ${bp}`;
}

render();
})();
