/* Layout: sidebar 80px + content (desktop ≥1024), header + cards + tab bar (mobile <1024). Tokens from Figma "Orders UI". */

/* ---------- shell ---------- */

              norm:v=>v.trim().toLowerCase(), valid:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) || "Неверный формат почты, пример: name@mail.ru",
              match:(o,v)=>o.email.toLowerCase()===v, hl:"email", extra:"email", extraLabel:"Почта" },
  phone:    { menu:"Номеру телефона", label:"Номеру телефона", noun:"Номер телефона", ph:"+7 (___) ___-__-__", spaceSplit:false,

};

function normPhone(v){
  let d = v.replace(/\D/g,"");
  if (d.length === 11 && (d[0] === "8" || d[0] === "7")) d = "7" + d.slice(1);
  else if (d.length === 10 && d[0] === "9") d = "7" + d;
  return d ? "+" + d : v.trim();
}
function fmtPhoneTyping(v){
  let d = v.replace(/\D/g,"");
  if (!d) return v.startsWith("+") ? "+" : "";
  if (d[0] === "8") d = "7" + d.slice(1);
  if (d[0] === "9") d = "7" + d;
  d = d.slice(0, 11);
  const p = d.slice(1);
  let out = "+7";
  if (p.length) out += " (" + p.slice(0,3);
  if (p.length >= 3) out += ")";
  if (p.length > 3) out += " " + p.slice(3,6);
  if (p.length > 6) out += "-" + p.slice(6,8);
  if (p.length > 8) out += "-" + p.slice(8,10);
  return out;
}

/* ================= filters ================= */
const FILTERS = {
  period: { title:"Период", single:true, def:"today", opts:[["today","За сегодня"],["yesterday","За вчера"],["week","За 7 дней"],["month","За 30 дней"],["all","За всё время"]] },

  sector: { title:"Сектор", opts:sectors.map(s=>[s,s]) },
  regular:{ title:"Регулярный платеж", single:true, def:"all", opts:[["all","Все"],["yes","Да"],["no","Нет"]], cosmetic:true },
  pay:    { title:"Способ оплаты", opts:[["card","Карта"],["sbp","СБП"]] },
};

/* ================= state ================= */
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const S = {
  open:false, crit:"order", chips:[], text:"", focus:false, hint:null, selectedChip:-1,
  sort:{ key:null, dir:1 }, page:1, size:20, mobShown:20,
  f:{ period:"today", status:new Set(), sector:new Set(), regular:"all", pay:new Set() },
  loading:false, delay:true, onboarded: store.get("orders-search-onboarded") === "1",
};
let uid = 0, searchToken = 0;

const $ = s => document.querySelector(s);

const moneyShort = n => (Number.isInteger(n) ? n.toLocaleString("ru-RU") : n.toLocaleString("ru-RU",{minimumFractionDigits:2})).replace(/ /g," ") + " ₽";
const isMobile = () => matchMedia("(max-width: 1023px)").matches;
const stClass = s => ({ Expired:"st-yellow", Completed:"st-green", Blocked:"st-grey" }[s] || "st-blue");

/* ================= logic ================= */
function passFilters(o, f = S.f){
  const day = Math.round((TODAY - new Date(...o.date.split(".").reverse().map((x,i)=>i===1?x-1:+x)).getTime()) / DAY);
  if (f.period === "today" && day !== 0) return false;
  if (f.period === "yesterday" && day !== 1) return false;
  if (f.period === "week" && day > 6) return false;
  if (f.period === "month" && day > 29) return false;
  if (f.status.size && !f.status.has(o.status)) return false;
  if (f.sector.size && !f.sector.has(o.sector)) return false;
  if (f.pay.size) { const sbp = o.merchant.includes("СБП"); if (!(f.pay.has("sbp") && sbp) && !(f.pay.has("card") && !sbp)) return false; }
  return true;
}
const validChips = () => S.chips.filter(c => c.valid);
function passSearch(o){
  const vc = validChips();
  if (!vc.length) return true;
  return vc.some(c => CRIT[c.field].match(o, c.value));
}
function results(){
  const k = S.sort.key, d = S.sort.dir;
  const list = ORDERS.filter(o => passFilters(o) && passSearch(o));
  if (!k) return list;
  return list.sort((a,b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * d);
}
function hiddenByFilters(){
  if (!validChips().length) return 0;
  return ORDERS.filter(o => passSearch(o) && !passFilters(o)).length;
}
function filtersActive(){ return S.f.period !== "today" || S.f.status.size || S.f.sector.size || S.f.pay.size || S.f.regular !== "all"; }

function addValues(raws, field = S.crit){
  const c = CRIT[field];
  let added = 0, dups = 0, over = 0, firstDup = null;
  for (let raw of raws) {
    raw = raw.trim(); if (!raw) continue;
    const value = c.norm(raw);
    const exist = S.chips.find(x => x.field === field && x.value === value);
    if (exist) { dups++; firstDup = firstDup || exist; continue; }
    if (S.chips.length >= LIMIT) { over++; continue; }
    const v = c.valid(value);
    S.chips.push({ id:++uid, field, value, valid:v === true, error:v === true ? "" : v });
    added++;
  }
  S.selectedChip = -1;
  const parts = [];
  if (over) parts.push(`Можно добавить не больше ${LIMIT} значений — ${over} не добавлено`);
  if (dups) parts.push(dups === 1 ? "Это значение уже добавлено" : `${dups} значения уже были добавлены`);
  S.hint = parts.length ? { err:!!over, text:parts.join(". ") } : null;
  render();

  if (added) runSearch();
  return { added, dups, over };
}
function removeChip(id){ S.chips = S.chips.filter(c => c.id !== id); S.selectedChip = -1; S.hint = null; render(); runSearch(); focusInput(); }
function editChip(id){
  const ch = S.chips.find(c => c.id === id); if (!ch) return;

  render(); runSearch(); focusInput(true);
}
function splitRaw(text, field = S.crit){
  const re = CRIT[field].spaceSplit ? /[,;\n\r\t ]+/ : /[,;\n\r\t]+/;
  return text.split(re);
}

  S.page = 1; S.mobShown = 20;

  const had = validChips().length;

/* ================= render: results ================= */
function hl(text, key){
  const vc = validChips().filter(c => CRIT[c.field].hl === key);
  if (!vc.length || !text) return esc(text);
  let html = esc(text);
  for (const c of vc) {
    const i = text.toLowerCase().indexOf(c.value.toLowerCase());
    if (i >= 0) { return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i + c.value.length)) + "</mark>" + esc(text.slice(i + c.value.length)); }
  }
  return html;
}
function extraMatch(o){
  for (const c of validChips()) { const cr = CRIT[c.field]; if (cr.extra && cr.match(o, c.value)) return { label: cr.extraLabel, value: o[cr.extra] }; }
  return null;
}
function emptyHTML(){
  const searching = validChips().length > 0;

  let title = "Ничего не найдено", text, acts = "";

    text = `Проверьте введенные данные. Ещё ${hidden} ${plural(hidden,"заказ","заказа","заказов")} подходит, но скрыто фильтрами`;
    acts = `<button class="link" data-act="widen">Показать за всё время без фильтров</button>`;
  } else if (searching) {
    text = "Проверьте введенные данные";
    acts = `<button class="link" data-act="clear-search">Очистить поиск</button>`;
  } else {
    text = "За выбранный период и с этими фильтрами заказов нет";
    acts = `<button class="link" data-act="reset-filters">Сбросить фильтры</button>`;
  }
  return `<div class="empty"><img src="assets/empty.svg" alt=""><h3>${title}</h3><p>${text}</p><div class="acts">${acts}</div></div>`;
}
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; }

/* ================= popovers ================= */
let popFor = null, kbdIdx = -1, popAnchor = null;
function closePop(){ const p = $("#pop"); p.hidden = true; p.className = "pop"; p.setAttribute("role","listbox"); p.style.minWidth = ""; popFor = null; hsErr = ""; document.querySelectorAll('[aria-expanded="true"]').forEach(b => { if (b.id !== "protoToggle") b.setAttribute("aria-expanded","false"); }); }
function placePop(anchor, extraClass){
  const p = $("#pop"); p.className = "pop " + (extraClass || ""); p.hidden = false; popAnchor = [anchor, extraClass];
  const r = anchor.getBoundingClientRect();
  p.style.position = "fixed"; p.style.right = "auto";
  if (extraClass === "crit-pop" && isMobile()) {
    const s = $("#search").getBoundingClientRect();
    p.style.left = (s.left + 8) + "px"; p.style.width = (s.width - 16) + "px"; p.style.top = (r.bottom + 4) + "px";
  } else {
    p.style.width = "";
    const w = Math.max(p.offsetWidth, 260);
    let left = Math.min(r.left, innerWidth - w - 16); left = Math.max(16, left);
    p.style.left = left + "px";
    const below = r.bottom + 8, h = p.offsetHeight;
    p.style.top = (below + h > innerHeight - 8 && r.top - h - 8 > 8 ? r.top - h - 8 : below) + "px";
  }
}
function openCritPop(btn){
  if (popFor === "crit") { closePop(); return; }

  p.innerHTML = CRIT_ORDER.map(k => `<button class="opt" role="option" data-crit="${k}" aria-selected="${k === S.crit}">${esc(CRIT[k].menu)}<svg class="check" viewBox="0 0 18 18" fill="none"><path d="M3.5 9.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`).join("");
  popFor = "crit"; kbdIdx = CRIT_ORDER.indexOf(S.crit);
  btn.setAttribute("aria-expanded","true"); placePop(btn, "crit-pop"); markKbd();
}
function openFilterPop(btn, key){
  if (popFor === "f:" + key) { closePop(); return; }
  const f = FILTERS[key], v = S.f[key], p = $("#pop");
  p.innerHTML = f.opts.map(([val, lbl]) => {
    const sel = f.single ? v === val : v.has(val);
    return `<button class="opt" role="option" data-fval="${esc(val)}" aria-selected="${sel}">${f.single ? "" : '<span class="box"></span>'}<span style="flex:1">${esc(lbl)}</span>${f.single ? '<svg class="check" viewBox="0 0 18 18" fill="none"><path d="M3.5 9.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}</button>`;
  }).join("") + (f.single ? "" : `<div class="pop-foot"><button class="link" data-fclear="${key}">Сбросить</button><button class="link" data-fdone>Готово</button></div>`);

}
function openSizePop(btn){

  popFor = "size"; $("#pop").setAttribute("role","listbox"); placePop(btn); $("#pop").style.minWidth = "140px";
}
let hsErr = "";
function openHsPop(btn, crit, keepText){
  if (popFor === "hs:" + crit && !keepText) { closePop(); return; }
  if (popFor) closePop();
  popFor = "hs:" + crit; hsErr = "";

}
function renderHsPop(crit, text){
  const c = CRIT[crit], mine = S.chips.filter(x => x.field === crit);
  $("#pop").setAttribute("role", "dialog");
  $("#pop").innerHTML = `<div class="hs-title">Поиск по столбцу «${esc(c.noun)}»</div>

      inputmode="${crit === "phone" ? "tel" : crit === "order" ? "numeric" : crit === "email" ? "email" : "text"}" placeholder="${esc(c.ph)}" value="${esc(text)}" aria-label="${esc(c.noun)}">
      <button class="enter-hint" style="display:inline-flex;margin:0" data-hsgo tabindex="-1"><kbd>Enter</kbd></button></div>
    <div class="hs-hint ${hsErr ? "err" : ""}" id="hsHint">${hsErr ? esc(hsErr) : `Нажмите <kbd>Enter</kbd>, чтобы найти. Несколько значений — через запятую`}</div>
    ${mine.length ? `<div class="hs-chips">${mine.map(ch => `<span class="chip ${ch.valid ? "" : "invalid"}" title="${esc(ch.value)}"><span class="v">${esc(ch.value)}</span><button class="x" data-hsrm="${ch.id}" aria-label="Удалить ${esc(ch.value)}"><span class="mask"></span></button></span>`).join("")}</div>
    <div class="hs-foot"><span>${mine.length} ${plural(mine.length,"значение","значения","значений")} в поиске</span><button class="link" data-hsclear="${crit}">Сбросить столбец</button></div>` : ""}`;
}
function hsCommit(){
  const crit = popFor && popFor.startsWith("hs:") ? popFor.slice(3) : null; const i = $("#hsq"); if (!crit || !i) return;
  const c = CRIT[crit];
  const raws = splitRaw(i.value, crit).map(r => r.trim()).filter(Boolean);
  if (!raws.length) { hsErr = "Введите значение"; renderHsPop(crit, ""); focusHs(); return; }
  const bad = raws.filter(r => c.valid(c.norm(r)) !== true), good = raws.filter(r => c.valid(c.norm(r)) === true);
  const dupCount = good.filter(r => S.chips.some(x => x.field === crit && x.value === c.norm(r))).length;
  if (good.length) {
    if (!S.open) { S.open = true; dismissCoach(true); }
    S.text = S.text || "";
    const r = addValues(good, crit);
    hsErr = r.over ? `Можно добавить не больше ${LIMIT} значений` : "";
  }
  if (bad.length) hsErr = c.valid(c.norm(bad[0])) + (bad.length > 1 ? ` (ещё ${bad.length - 1})` : "");
  else if (!good.length || (dupCount && dupCount === good.length)) hsErr = hsErr || "Это значение уже в поиске";
  renderHsPop(crit, bad.join(", "));
  const btn = document.getElementById("hs-" + crit); if (btn) { btn.setAttribute("aria-expanded","true"); placePop(btn, "hs-pop"); }
  focusHs();
}
function focusHs(){ requestAnimationFrame(() => { const i = $("#hsq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }
function markKbd(){ document.querySelectorAll("#pop .opt").forEach((o,i) => o.classList.toggle("kbd", i === kbdIdx)); }
function setCrit(k){
  S.crit = k; closePop();

  render(); focusInput();
}

/* ================= onboarding ================= */

/* ================= events ================= */
document.addEventListener("click", e => {
  const t = e.target;
  const act = t.closest("[data-act]");
  if (t.closest("#pop")) {
    if (t.closest("[data-hsgo]")) return hsCommit();
    const hr = t.closest("[data-hsrm]");
    if (hr) { const crit = popFor.slice(3), keep = $("#hsq") ? $("#hsq").value : ""; S.chips = S.chips.filter(c => c.id !== +hr.dataset.hsrm); S.hint = null; render(); runSearch(); hsErr = ""; renderHsPop(crit, keep); const b = document.getElementById("hs-" + crit); if (b) placePop(b, "hs-pop"); focusHs(); return; }
    const hc = t.closest("[data-hsclear]");
    if (hc) { const crit = hc.dataset.hsclear; S.chips = S.chips.filter(c => c.field !== crit); S.hint = null; render(); runSearch(); renderHsPop(crit, ""); focusHs(); return; }
    const o = t.closest("[data-crit]"); if (o) return setCrit(o.dataset.crit);
    const sz = t.closest("[data-size]"); if (sz) { S.size = +sz.dataset.size; S.page = 1; closePop(); return renderResults(); }
    const fv = t.closest("[data-fval]");

      if (f.single) { S.f[key] = fv.dataset.fval; closePop(); render(); runSearch(); return; }
      const set = S.f[key]; set.has(fv.dataset.fval) ? set.delete(fv.dataset.fval) : set.add(fv.dataset.fval);
      fv.setAttribute("aria-selected", set.has(fv.dataset.fval));
      btn.innerHTML = filterLabel(key) + '<img class="ico16" src="assets/arrow-down-s.svg" alt="">';
      S.page = 1; renderResults(); return;
    }
    if (t.closest("[data-fclear]")) { const key = t.closest("[data-fclear]").dataset.fclear; S.f[key].clear(); closePop(); render(); runSearch(); return; }
    if (t.closest("[data-fdone]")) { closePop(); render(); return; }
    return;
  }
  if (t.closest("#protoToggle")) { const m = $("#protoMenu"); m.hidden = !m.hidden; t.closest("#protoToggle").setAttribute("aria-expanded", !m.hidden); updateBp(); return; }
  const sc = t.closest("[data-sc]"); if (sc) { scenario(sc.dataset.sc); return; }
  if (!t.closest("#proto")) { $("#protoMenu").hidden = true; $("#protoToggle").setAttribute("aria-expanded","false"); }

  const rm = t.closest("[data-rm]"); if (rm) { e.stopPropagation(); return removeChip(+rm.dataset.rm); }
  const ed = t.closest("[data-edit]"); if (ed) return editChip(+ed.dataset.edit);
  if (t.closest("#critBtn")) return openCritPop(t.closest("#critBtn"));
  const fb = t.closest("[data-filter]"); if (fb) return openFilterPop(fb, fb.dataset.filter);
  if (t.closest("#sizeBtn")) return openSizePop(t.closest("#sizeBtn"));
  const pg = t.closest("[data-page]"); if (pg && !pg.disabled) { S.page = +pg.dataset.page; renderResults(); $("#tableCard .table-scroll").scrollTop = 0; return; }
  const hsb = t.closest("[data-hs]"); if (hsb) { e.stopPropagation(); return openHsPop(hsb, hsb.dataset.hs); }
  const so = t.closest("[data-sort]"); if (so) return toggleSort(so.dataset.sort);
  const ord = t.closest("[data-order]"); if (ord) { e.preventDefault(); return toast(`Откроется карточка заказа ${ord.dataset.order}`); }
  if (popFor) closePop();
  if (act) {
    const a = act.dataset.act;
    if (a === "open") { if (!S.onboarded) dismissCoach(true); return openSearch(); }
    if (a === "clear") return clearOrClose();
    if (a === "commit") { const q = $("#q"); if (q && q.value.trim()) { S.text = ""; addValues(splitRaw(q.value)); } focusInput(); return; }
    if (a === "coach-ok") return dismissCoach();
    if (a === "export") return toast(`Выгрузка ${results().length} ${plural(results().length,"заказа","заказов","заказов")} в XLSX`);
    if (a === "cols") return toast("Настройка колонок таблицы");
    if (a === "more") { S.mobShown += 20; return renderResults(); }
    if (a === "clear-search") return clearOrClose();
    if (a === "reset-filters") { S.f = { period:"today", status:new Set(), sector:new Set(), regular:"all", pay:new Set() }; render(); return runSearch(); }
    if (a === "widen") { S.f = { period:"all", status:new Set(), sector:new Set(), regular:"all", pay:new Set() }; render(); return runSearch(); }
  }
  if (t.closest("#field") && !t.closest("button")) focusInput();
  if (S.selectedChip >= 0 && !t.closest("#field")) { S.selectedChip = -1; renderTop(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "hsq") {
    if (e.key === "Enter") { e.preventDefault(); return hsCommit(); }
    if (e.key === "Escape") { e.preventDefault(); const crit = popFor.slice(3); closePop(); const b = document.getElementById("hs-" + crit); if (b) b.focus(); return; }
    return;
  }
  if (e.key === "Enter" && e.target.matches("[data-sort]")) return toggleSort(e.target.dataset.sort);
  if (popFor === "crit" && ["ArrowDown","ArrowUp","Enter","Escape","Tab"].includes(e.key) && (e.target.id === "critBtn" || e.target.id === "q" || e.target.closest("#pop"))) {
    if (e.key === "ArrowDown") { kbdIdx = (kbdIdx + 1) % CRIT_ORDER.length; markKbd(); e.preventDefault(); return; }
    if (e.key === "ArrowUp") { kbdIdx = (kbdIdx - 1 + CRIT_ORDER.length) % CRIT_ORDER.length; markKbd(); e.preventDefault(); return; }
    if (e.key === "Enter") { e.preventDefault(); return setCrit(CRIT_ORDER[kbdIdx]); }
    if (e.key === "Escape" || e.key === "Tab") { closePop(); if (e.key === "Escape") { e.preventDefault(); $("#critBtn").focus(); } return; }
  }
  if (e.key === "ArrowDown" && e.target.id === "critBtn") { e.preventDefault(); return openCritPop(e.target); }
  if (e.key === "Escape") {
    if (popFor) { closePop(); return; }
    if (!$("#protoMenu").hidden) { $("#protoMenu").hidden = true; return; }
    if (!S.onboarded && !S.open) return dismissCoach();
    if (S.open && e.target.id === "q") { if (S.text) { S.text = ""; renderTop(); focusInput(); } else if (!S.chips.length) closeSearch(); else e.target.blur(); }
    return;
  }
  if (e.target.id !== "q") return;
  const q = e.target;
  if (e.key === "Enter") {
    e.preventDefault();
    if (q.value.trim()) { S.text = ""; addValues(splitRaw(q.value)); focusInput(); }
    return;
  }
  if (e.key === "Backspace" && q.selectionStart === 0 && q.selectionEnd === 0 && S.chips.length) {
    e.preventDefault();
    if (S.selectedChip === S.chips.length - 1) removeChip(S.chips[S.chips.length - 1].id);
    else { S.selectedChip = S.chips.length - 1; renderTop(); focusInput(); }
    return;
  }
  if (e.key === "ArrowLeft" && q.selectionStart === 0 && S.chips.length) { S.selectedChip = Math.max(0, (S.selectedChip < 0 ? S.chips.length : S.selectedChip) - 1); renderTop(); $("#q").focus(); $("#q").setSelectionRange(0,0); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && S.selectedChip >= 0 && q.selectionStart === 0) { e.preventDefault(); removeChip(S.chips[S.selectedChip].id); return; }
  if (S.selectedChip >= 0 && e.key.length === 1) { S.selectedChip = -1; renderTop(); $("#q").focus(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "hsq") {
    const crit = popFor.slice(3), i = e.target;
    if (crit === "phone" && /^[\d\s()+\-]*$/.test(i.value) && i.selectionStart === i.value.length && !(e.inputType || "").startsWith("delete")) i.value = fmtPhoneTyping(i.value);
    if (hsErr) { hsErr = ""; $(".hs-field").classList.remove("err"); const h = $("#hsHint"); h.classList.remove("err"); h.innerHTML = "Нажмите <kbd>Enter</kbd>, чтобы найти. Несколько значений — через запятую"; }
    return;
  }
  if (e.target.id !== "q") return;
  const q = e.target; let v = q.value;
  const re = CRIT[S.crit].spaceSplit ? /[,;\n\t ]/ : /[,;\n\t]/;
  if (re.test(v)) {
    const parts = splitRaw(v); const last = parts.pop();
    S.text = S.crit === "phone" ? fmtPhoneTyping(last) : last;
    addValues(parts); focusInput(); return;
  }
  if (S.crit === "phone" && /^[\d\s()+\-]*$/.test(v)) {
    const atEnd = q.selectionStart === v.length;
    const f = fmtPhoneTyping(v);
    if (f !== v && atEnd && !(e.inputType || "").startsWith("delete")) { q.value = f; v = f; }
  }
  S.text = v;
  const fld = $("#field"); if (fld) fld.classList.toggle("typing", !!v.trim());
  if (S.hint && !S.hint.err) { S.hint = null; renderTop(); focusInput(); }
});
document.addEventListener("paste", e => {
  if (e.target.id !== "q") return;
  const txt = (e.clipboardData || window.clipboardData).getData("text");
  const re = CRIT[S.crit].spaceSplit ? /[,;\n\r\t ]/ : /[,;\n\r\t]/;
  if (!re.test(txt.trim())) return;
  e.preventDefault();
  const q = e.target; const before = q.value.slice(0, q.selectionStart), after = q.value.slice(q.selectionEnd);
  S.text = "";
  addValues(splitRaw(before + txt + after));
  focusInput();
});
document.addEventListener("focusin", e => { if (e.target.id === "q" && !S.focus) { S.focus = true; $("#field").classList.add("focus"); } });
document.addEventListener("focusout", e => { if (e.target.id === "q") { S.focus = false; const f = $("#field"); if (f) f.classList.remove("focus"); } });
addEventListener("resize", () => {
  if (popFor && popAnchor) {
    const [a, cls] = popAnchor;
    const sel = a.id ? "#" + a.id : a.dataset.filter ? `[data-filter="${a.dataset.filter}"]` : null;
    const fresh = sel && document.querySelector(sel);
    if (fresh && fresh.getClientRects().length) { fresh.setAttribute("aria-expanded","true"); placePop(fresh, cls); } else closePop();
  }
  positionCoach(); updateBp();
});
addEventListener("scroll", () => { positionCoach(); }, { passive: true });
document.addEventListener("scroll", e => {
  if (!e.target.classList || !e.target.classList.contains("table-scroll")) return;
  e.target.classList.toggle("scrolled-x", e.target.scrollLeft > 0);
  if (popFor && popFor.startsWith("hs:") && popAnchor) { const b = document.getElementById("hs-" + popFor.slice(3)); if (b) placePop(b, "hs-pop"); }
}, { capture: true, passive: true });

function toggleSort(key){ S.sort = S.sort.key === key ? { key, dir: -S.sort.dir } : { key, dir: key === "ts" ? -1 : 1 }; renderResults(); }

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* ================= scenarios ================= */
function resetAll(){
  closePop();
  Object.assign(S, { open:false, crit:"order", chips:[], text:"", hint:null, selectedChip:-1, page:1, mobShown:20, sort:{ key:null, dir:1 },
    f:{ period:"today", status:new Set(), sector:new Set(), regular:"all", pay:new Set() } });
}
function chip(field, value){ const c = CRIT[field]; const v = c.norm(value); const ok = c.valid(v); return { id:++uid, field, value:v, valid:ok === true, error:ok === true ? "" : ok }; }
function scenario(k){
  $("#protoMenu").hidden = true; $("#protoToggle").setAttribute("aria-expanded","false");
  if (k === "delay") { S.delay = !S.delay; $("#delayBtn").textContent = "Скелетон при поиске: " + (S.delay ? "вкл" : "выкл"); toast(S.delay ? "Скелетон включён" : "Скелетон выключен"); return; }
  resetAll();
  if (k === "onboarding") { S.onboarded = false; store.set("orders-search-onboarded","0"); }
  else S.onboarded = true, store.set("orders-search-onboarded","1");
  if (k === "multi") { S.open = true; S.crit = "phone"; S.chips = [chip("phone","+79992482323"), chip("order","10196074")]; }
  if (k === "empty") { S.open = true; S.chips = [chip("order","10196099")]; }
  if (k === "period") { S.open = true; S.crit = "email"; const o = ORDERS.find(x => x.date !== "20.12.2023"); S.chips = [chip("email", o.email)]; }
  if (k === "invalid") { S.open = true; S.crit = "email"; S.chips = [chip("email","a.lukonina@mail.ru"), chip("email","petrov.ivan@yandex"), chip("phone","8 999 248")]; S.hint = null; }
  if (k === "limit") { S.open = true; S.chips = ORDERS.slice(0, 20).map(o => chip("order", o.id.slice(0, 18))); }
  render(); runSearch();
  if (k === "invalid") setTimeout(() => { S.text = ""; addValues(["a.lukonina@mail.ru"]); }, 50);
  if (S.open) focusInput();
}
function updateBp(){
  const w = innerWidth;
  const bp = w < 576 ? "375 (мобильный)" : w < 1024 ? "576 (мобильный, широкий)" : w < 1280 ? "1024 (компактный десктоп)" : w < 1920 ? "1440 (десктоп)" : "1920 (широкий десктоп)";
  const el = $("#bpInfo"); if (el) el.textContent = `Ширина окна ${w}px → макет ${bp}`;
}

render();
})();
</script>
